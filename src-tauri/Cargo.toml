[package]
name = "install-a-program"
version = "0.1.5"
description = "Install a Program (Bulk Edition) — install multiple programs at once on Windows"
authors = ["Taylor Ivanoff"]
edition = "2021"
default-run = "install-a-program"

[features]
default = ["embedded-runner"]
embedded-runner = []

[lib]
name = "install_a_program_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "install-a-program-runner"
path = "src/bin/runner-standalone.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-tray-base = { path = "../../tauri-tray-base" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
